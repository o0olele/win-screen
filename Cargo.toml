[workspace]
members = [
    "crates/win-screen-core",
    "crates/win-screen-cli",
    "crates/win-screen-tauri",
    "examples/tauri-demo/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/local/win-screen"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
arboard = "3.4"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
thiserror = "2"
tracing = "0.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
